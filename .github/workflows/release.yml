# Windows 굽기. main 에 올라올 때는 시험·MSI 굽기만(산출물로), 릴리스 기계가 `tag` 를 주고 부르면 그 판 MSI 를 릴리스에 붙인다.
# 맥 판·피드 서명·피드 게시는 릴리스 기계(scripts/release.py)가 한다 — 이 저장소에는 비밀값이 없다.
name: windows

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "붙일 릴리스 태그(vX.Y.Z). 비우면 굽기만"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 카사텀 서브모듈의 LFS 를 통째로 받지 않는다 — 이 앱이 쓰는 글꼴만 따로 받는다.
  GIT_LFS_SKIP_SMUDGE: "1"
  CARGO_TERM_COLOR: always

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: true
          lfs: false

      - name: Fonts from the kasaterm submodule
        run: git -C kasaterm lfs pull --include="crates/kasa-gridview/assets/fonts/*"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Package
        shell: pwsh
        run: ./scripts/windows/package.ps1 -ExpectedVersion "${{ inputs.tag }}"

      - name: Attach to release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem dist -Filter "KasaDesk-*-windows-x86_64.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI 가 없다" }
          $names = @((gh release view "${{ inputs.tag }}" --json assets | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          if ($LASTEXITCODE -ne 0) { throw "릴리스 ${{ inputs.tag }} 를 못 읽었다 — 릴리스 기계가 먼저 만든다" }
          # 이미 붙은 MSI 는 덮지 않는다 — 다시 구운 파일로 갈면 피드 서명과 어긋난다.
          if ($names -contains $msi.Name) { Write-Host "이미 붙어 있다"; exit 0 }
          gh release upload "${{ inputs.tag }}" $msi.FullName "$($msi.FullName).sha256"
          if ($LASTEXITCODE -ne 0) { throw "MSI 를 못 붙였다" }

      - name: Keep the build
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: kasadesk-windows-x86_64
          path: dist/KasaDesk-*
          retention-days: 14
