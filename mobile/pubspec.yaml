name: kasadesk_mobile
description: "KasaDesk remote screen and lighting client for iPhone and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  kasadesk_protocol:
    path: protocol
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1
  vector_math: ^2.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/river.jpg
